<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matte-assistent – Tentamensøving</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #1a1a18;
    --text-muted: #6b6b67;
    --accent: #4a6cf7;
    --accent-light: #eef0fe;
    --radius: 12px;
    --radius-sm: 8px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  #app { width: 100%; max-width: 680px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 1.5rem; }
  #setup-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
  #setup-panel label { font-size: 13px; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 6px; margin-top: 1rem; }
  #setup-panel label:first-of-type { margin-top: 0; }
  #tasks-input { width: 100%; min-height: 180px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg); color: var(--text); resize: vertical; line-height: 1.6; font-family: inherit; }
  #tasks-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #start-btn { margin-top: 1.25rem; width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; cursor: pointer; }
  #start-btn:hover { opacity: 0.9; }
  #chat-panel { display: none; flex-direction: column; gap: 0.75rem; }
  #chat-header { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
  #chat-header h2 { font-size: 16px; font-weight: 600; }
  #chat-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  #reset-btn { font-size: 13px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; }
  #reset-btn:hover { background: var(--bg); color: var(--text); }
  #messages { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; min-height: 360px; max-height: 460px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; scroll-behavior: smooth; }
  .msg { display: flex; flex-direction: column; gap: 3px; max-width: 86%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; }
  .msg-label { font-size: 11px; color: var(--text-muted); }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  .msg.user .msg-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .msg.bot .msg-bubble { background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  .msg.bot .msg-bubble.thinking { color: var(--text-muted); font-style: italic; }
  .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick-btn { font-size: 12px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; }
  .quick-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  #input-row { display: flex; gap: 8px; }
  #user-input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--surface); color: var(--text); font-family: inherit; }
  #user-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #send-btn { padding: 11px 20px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: white; font-size: 14px; font-weight: 500; cursor: pointer; }
  #send-btn:hover { opacity: 0.9; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <div id="setup-panel">
    <h1>📐 Matte-assistent</h1>
    <p class="subtitle">Tentamensøving – skriv svar eller be om hjelp</p>
    <label for="tasks-input">Lim inn tentamensoppgavene her</label>
    <textarea id="tasks-input" placeholder="Oppgave 1: ...&#10;Oppgave 2: ...">Oppgave 1: Regn ut 3/4 + 2/3. Skriv svaret som en brøk.

Oppgave 2: En jakke kostet 800 kr. Den er nå satt ned med 25 %. Hva koster jakken nå?

Oppgave 3: Løs likningen: 2x + 5 = 17

Oppgave 4: En rektangulær flate er 12 m lang og 7,5 m bred. Regn ut arealet.

Oppgave 5: Skriv tallet 0,35 som a) brøk  b) prosent

Oppgave 6: Finn stigningskoeffisienten til en linje som går gjennom punktene (2, 4) og (6, 12).</textarea>
    <button id="start-btn">Start øvingsøkt →</button>
  </div>

  <div id="chat-panel">
    <div id="chat-header">
      <div>
        <h2>📐 Matte-assistent</h2>
        <p>Skriv svaret ditt eller be om hint – jeg gir ikke svar direkte!</p>
      </div>
      <button id="reset-btn">← Tilbake</button>
    </div>
    <div id="messages"></div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="quickSend('Kan du vise meg alle oppgavene?')">📋 Vis oppgavene</button>
      <button class="quick-btn" onclick="quickSend('Jeg trenger et hint')">💡 Hint</button>
      <button class="quick-btn" onclick="quickSend('Kan du forklare fremgangsmåten?')">📖 Fremgangsmåte</button>
      <button class="quick-btn" onclick="quickSend('Hva er svaret? Vis meg fasiten.')">✅ Vis fasit</button>
    </div>
    <div id="input-row">
      <input id="user-input" type="text" placeholder="Skriv svaret ditt eller still et spørsmål..." />
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
const API_KEY = "api03-e_kS79LL_Rl_JfN7vy56v08c22gYKdMLRkyK8hKgO29hRl-BAfflFjGTfv-Rhz8E5y0yHb0VauCqOeCjP8yRqQ-AYQroAAA";
let tasks = '';
let history = [];

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function addMsg(role, text, thinking) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'Deg' : 'Matte-assistent';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (thinking ? ' thinking' : '');
  bubble.textContent = text;
  div.appendChild(label);
  div.appendChild(bubble);
  msgs.appendChild(div);
  scrollToBottom();
  return bubble;
}

async function sendMessage(userText) {
  if (!userText.trim()) return;
  const btn = document.getElementById('send-btn');
  const input = document.getElementById('user-input');
  btn.disabled = true;
  input.value = '';
  addMsg('user', userText);
  history.push({ role: 'user', content: userText });
  const bubble = addMsg('bot', 'Tenker…', true);

  const systemPrompt = `Du er en hjelpsom og tålmodig matematikk-assistent for elever på 8. trinn i Norge. Du hjelper elevene med å øve til tentamen.

Her er oppgavene elevene skal øve på:
---
${tasks}
---

Regler du ALLTID følger:
1. Gi IKKE svaret direkte. Hjelp eleven å tenke selv med hint og ledende spørsmål.
2. Hvis en elev prøver å svare, gi konkret tilbakemelding: si om det er riktig, nesten riktig, eller feil – og forklar kort hvorfor.
3. Hvis eleven ber om hint, gi ett hint som peker dem i riktig retning uten å røpe svaret.
4. Kun hvis eleven eksplisitt spør "hva er svaret?" eller "vis fasiten", kan du gi svaret MED forklaring av fremgangsmåten.
5. Bruk enkelt, vennlig og motiverende språk. Oppmuntre eleven.
6. Svar alltid på norsk bokmål.
7. Hold svarene korte og tydelige – maks 3–4 avsnitt.`;

  try {
    const resp = await fetch("https://raspberrypi.tail063df7.ts.net/chat", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await resp.json();
    const reply = data.content?.find(b => b.type === 'text')?.text || 'Noe gikk galt.';
    bubble.textContent = reply;
    bubble.classList.remove('thinking');
    scrollToBottom();
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    bubble.textContent = '⚠️ Kunne ikke koble til. Prøv igjen.';
    bubble.classList.remove('thinking');
    scrollToBottom();
    history.pop();
  }
  btn.disabled = false;
  input.focus();
}

function quickSend(text) { sendMessage(text); }

document.getElementById('start-btn').addEventListener('click', () => {
  tasks = document.getElementById('tasks-input').value.trim();
  if (!tasks) { alert('Lim inn oppgavene først.'); return; }
  document.getElementById('setup-panel').style.display = 'none';
  const chat = document.getElementById('chat-panel');
  chat.style.display = 'flex';
  history = [];
  document.getElementById('messages').innerHTML = '';
  addMsg('bot', 'Hei! 😊 Jeg er her for å hjelpe deg øve til tentamen. Jeg gir deg ikke svaret med én gang – men jeg hjelper deg å finne det selv!\n\nSkriv gjerne svaret ditt på en oppgave, eller si hvilken oppgave du vil starte med.');
});

document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('setup-panel').style.display = 'block';
  document.getElementById('chat-panel').style.display = 'none';
  history = [];
});

document.getElementById('send-btn').addEventListener('click', () => sendMessage(document.getElementById('user-input').value));
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(e.target.value); }
});
</script>
</body>
</html>
